name: Cross-platform agents

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Cross-build all agents on macOS
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          targets: x86_64-unknown-linux-musl,x86_64-pc-windows-msvc,aarch64-apple-darwin
      - name: Install cross-compilers
        run: |
          brew install llvm
          python3 -m venv "$RUNNER_TEMP/agent-build-tools"
          "$RUNNER_TEMP/agent-build-tools/bin/pip" install ziglang==0.16.0
          echo "$RUNNER_TEMP/agent-build-tools/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          cargo install --locked cargo-zigbuild --version 0.23.3
          cargo install --locked cargo-xwin --version 0.23.0
      - name: Build and verify complete bundle
        run: cargo run --locked -p nafm-xtask -- build-agents
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: remote-agents
          path: apps/nafm-desktop/src-tauri/resources/agents/
          if-no-files-found: error

  smoke:
    needs: build
    name: Run agent on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            binary: nafm-agent-x86_64-unknown-linux-musl
          - os: windows-latest
            binary: nafm-agent-x86_64-pc-windows-msvc.exe
          - os: macos-15
            binary: nafm-agent-aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: remote-agents
          path: agent-bundle
      - name: Restore executable permission
        if: runner.os != 'Windows'
        run: chmod +x agent-bundle/nafm-agent-*
      - name: Test actual cross-built binary
        run: node --experimental-strip-types scripts/test-agent.ts agent-bundle/${{ matrix.binary }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - name: Test native installation and launch scripts
        env:
          NAFM_TEST_AGENT: agent-bundle/${{ matrix.binary }}
        run: cargo test --locked -p nafm-core --lib installer::tests::native_install_scripts_round_trip_agent -- --ignored

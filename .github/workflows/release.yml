name: Release desktop bundles

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  validate-version:
    name: Validate release version
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Match tag and application versions
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          if [[ ! "${tag}" =~ ^v((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))$ ]]; then
            echo "Release tag must be a semantic version such as v0.1.0; got ${tag}." >&2
            exit 1
          fi

          tag_version="${BASH_REMATCH[1]}"
          tauri_version="$(jq -er '.version' apps/nafm-desktop/src-tauri/tauri.conf.json)"
          frontend_version="$(jq -er '.version' apps/nafm-desktop/package.json)"
          cargo_version="$(sed -nE 's/^version = "([^"]+)"$/\1/p' apps/nafm-desktop/src-tauri/Cargo.toml | head -n 1)"

          if [[ -z "${cargo_version}" ]]; then
            echo "Could not read the desktop Cargo package version." >&2
            exit 1
          fi

          if [[ "${tag_version}" != "${tauri_version}" || \
                "${tag_version}" != "${frontend_version}" || \
                "${tag_version}" != "${cargo_version}" ]]; then
            echo "Release versions do not match:" >&2
            echo "  tag:          ${tag_version}" >&2
            echo "  Tauri config: ${tauri_version}" >&2
            echo "  package.json: ${frontend_version}" >&2
            echo "  Cargo.toml:   ${cargo_version}" >&2
            exit 1
          fi

          echo "Validated NAFM ${tag_version}."

  quality:
    name: Quality gate
    needs: validate-version
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  bundle:
    name: Bundle ${{ matrix.name }}
    needs:
      - quality
      - validate-version
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-15
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles dmg -- --locked
            apple_signing_identity: "-"
          - name: macOS Intel
            platform: macos-15-intel
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles dmg -- --locked
            apple_signing_identity: "-"
          - name: Linux x64
            platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: --target x86_64-unknown-linux-gnu --bundles appimage,deb -- --locked
            apple_signing_identity: ""
          - name: Windows x64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --bundles nsis -- --locked
            apple_signing_identity: ""
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libfuse2 \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf \
            wget \
            xdg-utils

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.30.3

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/nafm-desktop/pnpm-lock.yaml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: . -> target
          key: ${{ matrix.target }}

      - name: Install frontend dependencies
        working-directory: apps/nafm-desktop
        run: pnpm install --frozen-lockfile

      - name: Build and attach desktop bundle
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          APPLE_SIGNING_IDENTITY: ${{ matrix.apple_signing_identity }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/nafm-desktop
          tauriScript: pnpm tauri
          tagName: ${{ github.ref_name }}
          releaseName: NAFM ${{ github.ref_name }}
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: false
          retryAttempts: 2
          args: ${{ matrix.args }}
          releaseAssetNamePattern: NAFM_[version]_[platform]_[arch][ext]

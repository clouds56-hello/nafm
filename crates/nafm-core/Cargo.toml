[package]
name = "nafm-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
nafm-protocol = { path = "../nafm-protocol" }
nafm-bundle = { path = "../nafm-bundle" }
base64 = "0.22"
blake3.workspace = true
chrono.workspace = true
directories.workspace = true
fs2 = "0.4.3"
percent-encoding.workspace = true
rusqlite = { workspace = true, features = ["functions"] }
serde.workspace = true
serde_json.workspace = true
smb2.workspace = true
thiserror.workspace = true
tokio.workspace = true
url.workspace = true
uuid.workspace = true
walkdir.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
trash.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.4", features = ["fs", "process"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = ["Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_WindowsProgramming", "Win32_UI_Shell"] }

[dev-dependencies]
tempfile.workspace = true
